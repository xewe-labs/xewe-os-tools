[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xewe-os-tools"
version = "0.1.1"
description = "Setup, build, flash, serial and test tooling for XeWe OS firmware projects"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dependencies = ["pyserial>=3.5", "pytest>=8.0"]

[project.optional-dependencies]
# pytest is already a runtime dependency (it is the firmware test runner). dev adds ruff, which
# `xewe format` runs on Python files when it is importable (C++ needs clang-format, not a pip
# dependency: system package, or `pip install clang-format` into the same venv).
dev = ["ruff"]

[project.scripts]
xewe = "xewe.cli:main"

[project.entry-points.pytest11]
xewe = "xewe.testing.plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xewe.build" = ["clang-format"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
mypy_path = "src"
packages = ["xewe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
# pytest's default norecursedirs skips any "build" folder, which would drop tests/build/.
norecursedirs = [".*", "*.egg", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}", "__pycache__"]
