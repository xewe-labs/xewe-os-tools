[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xewe-os-tools"
version = "0.1.1"
description = "Setup, build, flash, serial and test tooling for XeWe OS firmware projects"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dependencies = ["pyserial>=3.5", "pytest>=8.0"]

[project.optional-dependencies]
# pytest is already a runtime dependency (it is the firmware test runner). dev adds ruff, which
# `xewe format` runs on Python files when it is importable (C++ needs clang-format, not a pip
# dependency: system package, or `pip install clang-format` into the same venv).
dev = ["ruff"]

[project.scripts]
xewe = "xewe.cli:main"

[project.entry-points.pytest11]
xewe = "xewe.testing.plugin"

[tool.setuptools]
# src/ is the `xewe` package; list every subpackage (a missing one ships silently absent).
packages = ["xewe", "xewe.env", "xewe.build", "xewe.board", "xewe.modules", "xewe.testing"]

[tool.setuptools.package-dir]
xewe = "src"

[tool.ruff]
# the tools' own style (the code is not ruff-formatted yet: that is a separate whitespace-only commit)
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
# pytest's default norecursedirs skips any "build" folder, which would drop tests/build/.
norecursedirs = [".*", "*.egg", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}", "__pycache__"]
