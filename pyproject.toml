[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xewe-os-tools"
version = "0.1.0"
description = "Setup, build, flash, serial and test tooling for XeWe OS firmware projects"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
dependencies = ["pyserial>=3.5", "pytest>=8.0"]

[project.optional-dependencies]
# pytest is already a runtime dependency (it is the firmware test runner); the extra exists so
# `pip install -e .[dev]` works for development checkouts.
dev = []

[project.scripts]
xewe = "xewe.cli:main"

[project.entry-points.pytest11]
xewe = "xewe.testing.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
