# ci.yml: the tools' own checks (pytest, pyflakes, mypy), actionlint on the reusable workflows in
# this folder, `xewe format --check`, `xewe brand-lint` and the release card check. Every job
# blocks. Board-free; no toolchain download.
name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest, pyflakes, mypy (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q . pyflakes mypy types-pyserial
      # the JUnit file is the release card check's CI evidence (one Python is enough: same ids)
      - name: pytest
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/card/junit/tests-unit.xml" -o junit_family=xunit1
      - name: Upload the card inputs
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card/
          retention-days: 14
      - name: pyflakes
        run: python -m pyflakes src tests
      - name: mypy
        run: python -m mypy

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:latest
        with:
          # xewe-board: the label of the future self-hosted board runner (xewe-board.yml)
          args: -color -ignore xewe-board

  # The tools from this checkout, plus ruff and clang-format at fixed versions so a newer release
  # never turns a formatted tree red. XEWE_CLANG_FORMAT picks the pip one over the runner's.
  format:
    name: xewe format --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe format --check
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q . "ruff==0.17.0" "clang-format==23.1.3"
          XEWE_CLANG_FORMAT="$RUNNER_TEMP/venv/bin/clang-format" "$RUNNER_TEMP/venv/bin/xewe" format --check

  brand-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe brand-lint
        run: |
          python -m pip install -q .
          python -m xewe brand-lint .

  # On a prepare commit (HEAD holds releases/<v>/release_card.md and the card's tested tree is
  # HEAD's tree), the card must agree with this run's pytest results: `xewe release-card verify
  # --ci`, with the tools of this checkout. On any other commit the job finds no card and its
  # steps are skipped.
  card:
    name: release card check
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q .
      - name: Release card for this tree
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # A tag run: the card is the tag message's (notes lines, a blank line, then release_card.md
          # from its first `# ` line on; tag made with `git tag -a --cleanup=verbatim`), never the tree's.
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag="$GITHUB_REF_NAME" msg="$RUNNER_TEMP/tag-message.txt" card="$RUNNER_TEMP/tag-card/release_card.md"
            git fetch -q --force --depth 1 origin "+refs/tags/$tag:refs/tags/$tag"
            [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || { echo "::error::$tag is a lightweight tag: it holds no release card"; exit 1; }
            git for-each-ref --format='%(contents)' "refs/tags/$tag" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > "$msg"
            mkdir -p "${card%/*}"
            sed -n '/^# /,$p' "$msg" > "$card"
            [[ -s "$card" ]] || { echo "::error::the message of tag $tag holds no release card (no line starting with '# ')"; exit 1; }
            echo "release card from tag $tag: $(head -n 1 "$card")"
            echo "cards=$card" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=()
          # exit 0: the card's tested tree is this tree; exit 1 with "is not the card's": another
          # tree, the only result that skips a card. Anything else (a card whose data block is
          # missing or malformed: exit 2; git missing) fails the job.
          while IFS= read -r -d '' card; do
            rc=0
            out="$("$RUNNER_TEMP/venv/bin/python" -m xewe release-card fingerprint --card "$card" --check)" || rc=$?
            echo "$out"
            case "$rc" in
              0) found+=("$card") ;;
              1) [[ "$out" == *"is not the card's"* ]] || { echo "::error::xewe release-card fingerprint failed on $card (exit 1)"; exit 1; } ;;
              *) echo "::error::xewe release-card fingerprint failed on $card (exit $rc)"; exit "$rc" ;;
            esac
          done < <(git ls-files -z -- 'releases/*/release_card.md')
          echo "cards=${found[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#found[@]} -gt 0 ]] || echo "::notice::no release card for this tree; the check is skipped"
      - uses: actions/download-artifact@v8
        if: steps.find.outputs.cards != ''
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card
      # pytest of the tools is all unit tests (no board session); no firmware, so no --meta-dir
      - name: xewe release-card verify --ci
        if: steps.find.outputs.cards != ''
        env:
          CARDS: ${{ steps.find.outputs.cards }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra cards <<< "$CARDS"
          for card in "${cards[@]}"; do
            "$RUNNER_TEMP/venv/bin/python" -m xewe release-card verify --ci --unit-only --card "$card" \
              --junit-dir "$RUNNER_TEMP/card/junit"
          done
