# xewe-release.yml: reusable release for a XeWe OS firmware project, run on a version tag.
# Jobs:
#   plan      version from the tag, the chips that have rows in release_matrix.csv, release notes
#   build     one job per chip (fail-fast off): ./setup.sh, `xewe release --chip C` (that chip's
#             matrix rows), the default `xewe build --chip C` and `xewe test --no-board --chip C`
#             with JUnit output for the release-card check
#   assemble  `xewe release-card verify --ci` against the committed releases/<v>/release_card.md
#             (on the pristine checkout), `xewe release --assemble` (firmware_map.csv in matrix
#             order, the tarball and the flat assets in build/release/<v>/assets/), then the
#             GitHub Release: every bin, each row's
#             <prefix>_meta.json and <prefix>_manifest.json, firmware_map.csv, firmware-<v>.tar.gz
#             and release_card.md. No logs are published.
# The GitHub Release is the only place binaries live. `publish_branch: true` (deprecated, opt-in)
# also commits the release folder to `releases_branch`, as before; firmware is never committed to
# the project's own tree (xewe-build.yml lint).
# Tags: X.Y.Z (release) or X.Y.Z-<suffix> (pre-release, e.g. 3.1.0-rc1); a leading `v` is
# accepted. X.Y.Z must equal [project] version in xewe.toml at the tagged commit. See doc/ci.md.
name: xewe-release

on:
  workflow_call:
    inputs:
      publish_branch:
        description: "deprecated, opt-in: also commit the release folder (binaries in git) to releases_branch"
        type: boolean
        default: false
      releases_branch:
        description: "with publish_branch: branch that holds static/firmware/releases/ (`releases`, or `main`)"
        type: string
        default: "releases"
      modules:
        description: "optional ./setup.sh --modules value; empty keeps xewe.toml's selection"
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
      timeout_minutes:
        description: "timeout of each job (a chip job builds all of that chip's matrix rows)"
        type: number
        default: 90
      require_card:
        description: "fail when releases/<X.Y.Z>/release_card.md is not in the tagged tree"
        type: boolean
        default: true

permissions:
  contents: write

env:
  XEWE_NO_BOARD: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      base: ${{ steps.ver.outputs.base }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      chips: ${{ steps.chips.outputs.chips }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::run on a tag (got $GITHUB_REF)"; exit 1; }
          full="${tag#v}"
          base="${full%%-*}"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $tag is not X.Y.Z[-suffix]"; exit 1; }
          manifest="$(python3 -c 'import tomllib; print(tomllib.load(open("xewe.toml", "rb"))["project"]["version"])')"
          [[ "$manifest" == "$base" ]] || { echo "::error::tag $tag does not match [project] version $manifest in xewe.toml; bump xewe.toml first"; exit 1; }
          pre=false; [[ "$full" != "$base" ]] && pre=true
          { echo "tag=$tag"; echo "version=$full"; echo "base=$base"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

      # the build jobs' matrix: chips in the order of their first release_matrix.csv row (CHIP
      # column, any case, read as CSV; rows with an empty first cell skipped, as xewe release reads
      # it; the chip lower-cased, as --chip takes it)
      - name: Chips in the release matrix
        id: chips
        shell: bash
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import csv, json, pathlib
          path = pathlib.Path("release_matrix.csv")
          chips = ["c3", "c6", "s3"]
          if path.is_file():
              with path.open(encoding="utf-8", newline="") as f:
                  head, *rows = list(csv.reader(f))
              col = next(i for i, h in enumerate(head) if h.strip().lower() == "chip")
              chips = list(dict.fromkeys(r[col].strip().lower() for r in rows if r and r[0] and col < len(r)))
          print(f"chips={json.dumps(chips)}")
          PY
          tail -n 1 "$GITHUB_OUTPUT"

      - name: Release notes from the tag message
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          git fetch -q --force --depth 1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref --format='%(contents)' "refs/tags/$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/notes/notes.txt"
          [[ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes/notes.txt")" ]] || echo "Release $TAG" > "$RUNNER_TEMP/notes/notes.txt"
          cat "$RUNNER_TEMP/notes/notes.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes/notes.txt
          if-no-files-found: error
          retention-days: 30

  build:
    name: build (${{ matrix.chip }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJSON(needs.plan.outputs.chips) }}
    env:
      BASE: ${{ needs.plan.outputs.base }}
      CHIP: ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Resolve the tools ref and the toolchain pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          read -r repo ref < <(python3 -c 'import tomllib; t = tomllib.load(open("xewe.toml", "rb")).get("tools", {}); print(t.get("repo", "https://github.com/xewe-labs/xewe-os-tools"), t.get("ref", "latest"))')
          dest="$RUNNER_TEMP/xewe-tools"
          if [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
            git init -q "$dest"; git -C "$dest" fetch -q --depth 1 "$repo" "$ref"; git -C "$dest" checkout -q FETCH_HEAD
          else
            track="$ref"; [[ "$ref" == latest ]] && track=""
            git clone -q --depth 1 ${track:+--branch "$track"} "$repo" "$dest"
          fi
          pins="$dest/src/xewe/env/pins.py"; [[ -f "$pins" ]] || pins="$dest/src/env/pins.py"
          python3 - "$pins" >> "$GITHUB_OUTPUT" <<'PY'
          import runpy, sys
          pins = runpy.run_path(sys.argv[1])
          print(f"cli={pins['ARDUINO_CLI_VERSION']}")
          print(f"esp32={pins['ESP32_CORE_VERSION']}")
          PY

      - name: Cache the shared toolchain (~/.xewe-os/build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ~/.xewe-os/build-tools/bin
            ~/.xewe-os/build-tools/arduino15
            ~/.xewe-os/build-tools/arduino-user
          key: xewe-toolchain-${{ runner.os }}-${{ runner.arch }}-cli${{ steps.pins.outputs.cli }}-esp32-${{ steps.pins.outputs.esp32 }}

      # `latest` refs resolve here, at release time; build_config.toml records the commits.
      - name: ./setup.sh
        shell: bash
        env:
          MODULES: ${{ inputs.modules }}
        run: ./setup.sh ${MODULES:+--modules "$MODULES"} </dev/null

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: ${{ runner.temp }}/notes

      # this chip's release_matrix.csv rows (default: one row per chip) with version X.Y.Z, and
      # firmware_map.<chip>.csv for the assemble job
      - name: xewe release --chip
        run: build/tools/.venv/bin/python -m xewe release --version "$BASE" --chip "$CHIP" --notes "$RUNNER_TEMP/notes/notes.txt"

      # the default image (no matrix defines), as the card's images table records it
      - name: xewe build (default image)
        shell: bash
        run: |
          set -euo pipefail
          build/tools/.venv/bin/python -m xewe build --chip "$CHIP"
          mkdir -p "$RUNNER_TEMP/card/meta" "$RUNNER_TEMP/card/junit"
          cp "build/builds/$CHIP/out/meta.json" "$RUNNER_TEMP/card/meta/build-$CHIP.meta.json"

      # unit tests run; board tests are compiled, not run; JUnit as the card's runs record it
      - name: xewe test --no-board --chip
        run: >-
          build/tools/.venv/bin/python -m xewe test --no-board --chip "$CHIP" --
          --junitxml="$RUNNER_TEMP/card/junit/tests-$CHIP.xml" -o junit_family=xunit1 -o junit_logging=no -ra

      - name: Upload this chip's release rows
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.chip }}
          path: static/firmware/releases/${{ needs.plan.outputs.base }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload this chip's card inputs
        uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.chip }}
          path: ${{ runner.temp }}/card/
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      BASE: ${{ needs.plan.outputs.base }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # no toolchain: assembling and the card check only read files
      - name: Install the tools at the manifest ref
        shell: bash
        run: |
          set -euo pipefail
          read -r repo ref < <(python3 -c 'import tomllib; t = tomllib.load(open("xewe.toml", "rb")).get("tools", {}); print(t.get("repo", "https://github.com/xewe-labs/xewe-os-tools"), t.get("ref", "latest"))')
          dest="$RUNNER_TEMP/xewe-tools"
          if [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
            git init -q "$dest"; git -C "$dest" fetch -q --depth 1 "$repo" "$ref"; git -C "$dest" checkout -q FETCH_HEAD
          else
            track="$ref"; [[ "$ref" == latest ]] && track=""
            git clone -q --depth 1 ${track:+--branch "$track"} "$repo" "$dest"
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$dest"

      - name: Download the chip jobs' card inputs
        uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true
          path: ${{ runner.temp }}/card

      # The committed card must describe this tree and these results (doc/ci.md "Releases"); a
      # block fails the job before anything is published. It runs on the pristine checkout, before
      # the release rows are downloaded and `xewe release --assemble` rewrites xewe.toml, so the
      # tree fingerprint is the tagged tree's.
      - name: Release card check
        shell: bash
        env:
          REQUIRE: ${{ inputs.require_card }}
        run: |
          set -euo pipefail
          card="releases/$BASE/release_card.md"
          if [[ ! -f "$card" ]]; then
            if [[ "$REQUIRE" == true ]]; then
              echo "::error::$card is not in the tagged tree; run scripts/release.sh --prepare $BASE and commit the card"
              exit 1
            fi
            echo "::warning::$card is not in the tagged tree; the release has no card"
            exit 0
          fi
          "$RUNNER_TEMP/venv/bin/python" -m xewe release-card verify --ci --card "$card" \
            --junit-dir "$RUNNER_TEMP/card/junit" --meta-dir "$RUNNER_TEMP/card/meta"

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: ${{ runner.temp }}/notes

      - name: Download the chip jobs' release rows
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: static/firmware/releases/${{ needs.plan.outputs.base }}

      - name: xewe release --assemble
        run: '"$RUNNER_TEMP/venv/bin/python" -m xewe release --version "$BASE" --assemble --notes "$RUNNER_TEMP/notes/notes.txt"'

      # Pre-release tags: the folder is renamed to the full tag version (X.Y.Z-rc1) so it never
      # claims X.Y.Z; the binaries inside still report X.Y.Z. meta.json already records what the
      # release was built from (project_commit, core/modules/tools *_ref + *_commit, libraries:
      # doc/spec.md §11); this step adds release_tag to every row's meta.json (and to its staged
      # asset copy), appends the provenance of the first row to the release notes and rebuilds the
      # tarball under the full version.
      - name: Finish the release folder
        id: dir
        shell: bash
        run: |
          set -euo pipefail
          rel=static/firmware/releases
          assets="build/release/$BASE/assets"
          if [[ "$VERSION" != "$BASE" ]]; then
            rm -rf "${rel:?}/$VERSION"
            mv "$rel/$BASE" "$rel/$VERSION"
          fi
          rm -f "$rel/firmware-$BASE.tar.gz" "$assets/firmware-$BASE.tar.gz"
          python3 - "$rel/$VERSION" "$BASE" "$VERSION" "$assets" <<'PY'
          import csv, json, os, pathlib, shutil, sys
          root, base, version, assets = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3], pathlib.Path(sys.argv[4])
          with open(root / "firmware_map.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          for row in rows:
              meta = root / row["_PATH"] / "meta.json"
              data = json.loads(meta.read_text())
              for k, v in data.get("artifacts", {}).items():
                  if k.startswith("path_rel_"):
                      data["artifacts"][k] = v.replace(f"/releases/{base}/", f"/releases/{version}/")
              data["release_tag"] = os.environ["GITHUB_REF_NAME"]
              meta.write_text(json.dumps(data, indent=2) + "\n")
              shutil.copyfile(meta, assets / row["_META"])
          m = json.loads((root / rows[0]["_PATH"] / "meta.json").read_text())
          lines = ["", "", "Built from:", f"- project {m['project_commit']}",
                   *(f"- {n} {m[n + '_ref']} @ {m[n + '_commit']}" for n in ("core", "modules", "tools")),
                   *(f"- {k} {v['ref']} @ {v['commit']}" for k, v in m["libraries"].items()),
                   f"- arduino-cli {m.get('arduino_cli', '')}, esp32 core {m.get('esp32_core', '')}"]
          notes = root / "release_notes.txt"
          notes.write_text(notes.read_text().rstrip("\n") + "\n".join(lines) + "\n")
          PY
          tar -C "$rel" -czf "$rel/firmware-$VERSION.tar.gz" "$VERSION"
          cp "$rel/firmware-$VERSION.tar.gz" "$assets/"
          echo "path=$rel/$VERSION" >> "$GITHUB_OUTPUT"
          ls -l "$assets"
          cat "$rel/$VERSION/release_notes.txt"

      # Latest only when this version is >= every non-pre-release already published (a re-hosted
      # legacy release or a patch of an older line never takes "latest" from a newer one).
      - name: Choose the latest flag
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=false
          if [[ "$PRE" != true ]]; then
            latest=true
            tags="$(gh release list --exclude-pre-releases --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
            while IFS= read -r t; do
              t="${t#v}"; t="${t%%-*}"
              [[ "$t" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if [[ "$(printf '%s\n%s\n' "$t" "$BASE" | sort -V | tail -n 1)" != "$BASE" ]]; then latest=false; fi
            done <<< "$tags"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"

      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.dir.outputs.path }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          files=("build/release/$BASE/assets"/*)
          card="releases/$BASE/release_card.md"
          if [[ -f "$card" ]]; then files+=("$card"); fi
          flags=(--title "$TAG" --notes-file "$DIR/release_notes.txt" --verify-tag "--latest=$LATEST")
          if [[ "$PRE" == true ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
          echo "${#files[@]} assets"

      - name: Commit to the releases branch
        if: inputs.publish_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ inputs.releases_branch }}
        run: |
          set -euo pipefail
          echo "::warning::publish_branch is deprecated: binaries are GitHub Release assets; see doc/ci.md"
          w="$RUNNER_TEMP/releases-branch"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Git LFS (preinstalled on ubuntu-latest): the clean filter and the pre-push upload for the
          # .bin files the branch's .gitattributes routes to LFS; no download of older ones (skip smudge)
          git lfs install --local
          export GIT_LFS_SKIP_SMUDGE=1
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null; then
            git fetch -q --depth 1 origin "$BR"
            git worktree add -q -B "$BR" "$w" FETCH_HEAD
          else
            git worktree add -q --detach "$w" HEAD
            git -C "$w" checkout -q --orphan "$BR"
            git -C "$w" rm -rq --cached .
            find "$w" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf '# %s releases\n\nRelease folders for the web flasher, written by CI from version tags.\nThe canonical copies are the GitHub Releases. Never edit by hand.\n' "${GITHUB_REPOSITORY#*/}" > "$w/README.md"
          fi
          rel=static/firmware/releases
          mkdir -p "$w/$rel"
          rm -rf "${w:?}/$rel/$VERSION"
          cp -R "$rel/$VERSION" "$w/$rel/"
          # index.json: every version on the branch, newest first, for the flasher's version picker
          python3 - "$w/$rel" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          entries = []
          for d in root.iterdir():
              if not d.is_dir():
                  continue
              builds, tag = [], None
              for meta in sorted(d.rglob("meta.json")):
                  m = json.loads(meta.read_text())
                  tag = tag or m.get("release_tag")
                  builds.append({"chip": m.get("type"), "path": str(meta.parent.relative_to(root)),
                                 "binary": m.get("artifacts", {}).get("binary_filename"),
                                 "config": m.get("config", {})})
              entries.append({"version": d.name, "prerelease": "-" in d.name,
                              "tag": tag,
                              "builds": builds})
          def key(e):
              base, _, pre = e["version"].partition("-")
              nums = tuple(int(x) for x in base.split(".") if x.isdigit())
              return (nums, pre == "", pre)
          entries.sort(key=key, reverse=True)
          (root / "index.json").write_text(json.dumps({"releases": entries}, indent=2) + "\n")
          PY
          git -C "$w" add -A
          if git -C "$w" diff --cached --quiet; then echo "$BR already up to date"; exit 0; fi
          # a .bin that .gitattributes routes to LFS must be staged as a pointer, not as the binary
          while IFS= read -r f; do
            if [[ "$(git -C "$w" check-attr filter -- "$f" | sed 's/.*: filter: //')" == lfs ]] \
              && (( $(git -C "$w" cat-file -s ":$f") > 1024 )); then
              echo "::error::$f is not an LFS pointer (git lfs install failed?)"; exit 1
            fi
          done < <(git -C "$w" diff --cached --name-only -- "$rel/$VERSION" | grep '\.bin$' || true)
          # [skip ci]: a push to a branch with CI would otherwise build the same commit again
          git -C "$w" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "release $VERSION ($TAG, ${GITHUB_SHA::7}) [skip ci]"
          git -C "$w" push -q "$url" "HEAD:refs/heads/$BR"
          echo "pushed $BR: $rel/$VERSION"
          git -C "$w" lfs ls-files | grep -F "$rel/$VERSION/" || true
