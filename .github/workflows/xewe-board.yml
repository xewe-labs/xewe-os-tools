# xewe-board.yml: PLACEHOLDER for board tests on a future self-hosted runner with the S3 attached
# (today the Mac runs run_tests/10_project.sh by hand). Nothing calls this yet, and a call without
# a registered runner labelled [self-hosted, xewe-board] waits in the queue until it times out.
# Enable: register a runner on the Mac with the label `xewe-board`, put the dotenv on that machine
# (never in a secret or the repo), then add to a project's ci.yml:
#   board:
#     needs: build
#     if: github.event_name == 'workflow_dispatch'
#     uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-board.yml@main
#     with: { chip: s3, dotenv: /Users/<you>/xewe/dotenv }
name: xewe-board

on:
  workflow_call:
    inputs:
      chip:
        type: string
        default: "s3"
      dotenv:
        description: "absolute path of the dotenv on the runner machine (Wi-Fi, device settings)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  board:
    runs-on: [self-hosted, xewe-board]
    timeout-minutes: 60
    concurrency:
      group: xewe-board   # one board, one job at a time across every repo using this runner
      cancel-in-progress: false
    env:
      XEWE_REQUIRE_BOARD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: ./setup.sh
        run: ./setup.sh </dev/null
      - name: build, erase and flash
        env:
          CHIP: ${{ inputs.chip }}
        run: |
          build/tools/.venv/bin/python -m xewe build --chip "$CHIP"
          build/tools/.venv/bin/python -m xewe flash --chip "$CHIP" --erase --no-build
      - name: provision
        env:
          DOTENV: ${{ inputs.dotenv }}
        run: build/tools/.venv/bin/python -m xewe provision --env "$DOTENV"
      - name: board tests
        env:
          CHIP: ${{ inputs.chip }}
          DOTENV: ${{ inputs.dotenv }}
        run: build/tools/.venv/bin/python -m xewe test --chip "$CHIP" --require-board --env "$DOTENV" -- --junitxml="$RUNNER_TEMP/board-junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-junit-${{ inputs.chip }}
          path: ${{ runner.temp }}/board-junit.xml
