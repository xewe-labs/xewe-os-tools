# xewe-core-tests.yml: reusable checks for xewe-os-core (the XeWeCore Arduino library).
# Host unit tests (tests/unit/run.sh), arduino-lint (strict, Library Manager update: the
# Library Manager rules of core's doc/LIBRARY_RULES.md), the examples compiled for c3, c6 and s3,
# `xewe format --check` and `xewe brand-lint`, and on a prepare commit the release-card check
# (`xewe release-card verify --ci`). Every job blocks.
# Nothing here publishes: core is released with its own scripts/release.sh (tag X.Y.Z, then the
# Arduino Library Manager picks it up). See doc/ci.md.
name: xewe-core-tests

on:
  workflow_call:
    inputs:
      tools_ref:
        description: "xewe-os-tools ref whose format, brand-lint, toolchain pins and chip FQBNs are used"
        type: string
        default: "main"
      arduinojson_ref:
        description: "ArduinoJson tag for the host unit tests and the example builds"
        type: string
        default: "v7.4.3"

permissions:
  contents: read

jobs:
  host:
    name: host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch ArduinoJson (header-only, no package manager)
        env:
          REF: ${{ inputs.arduinojson_ref }}
        run: git clone -q --depth 1 --branch "$REF" https://github.com/bblanchon/ArduinoJson "$RUNNER_TEMP/ArduinoJson"
      # the output is kept for the card job: its `ok`/`FAIL <name>` lines are the unit rows, the same
      # evidence the card's `record --format core-host` step parsed (no JUnit: the ids would differ)
      - name: tests/unit/run.sh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/card/junit"
          ARDUINOJSON_SRC="$RUNNER_TEMP/ArduinoJson/src" tests/unit/run.sh 2>&1 | tee "$RUNNER_TEMP/card/junit/tests-unit.log"
      - name: Upload the card inputs
        uses: actions/upload-artifact@v7
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card/
          retention-days: 14

  # On a prepare commit (HEAD holds releases/<v>/release_card.md and the card's tested tree is
  # HEAD's tree), the card must agree with these CI results: `xewe release-card verify --ci`.
  # On any other commit the job finds no card and its steps are skipped.
  card:
    name: release card check
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the fingerprint is the tools' own (`xewe release-card fingerprint`, doc/spec.md §14), so
      # this job and `verify` can never disagree on what "this tree" is
      - name: Install the tools
        env:
          REF: ${{ inputs.tools_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF"
      - name: Release card for this tree
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # A tag run: the card is the tag message's (notes lines, a blank line, then release_card.md
          # from its first `# ` line on; tag made with `git tag -a --cleanup=verbatim`), never the tree's.
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag="$GITHUB_REF_NAME" msg="$RUNNER_TEMP/tag-message.txt" card="$RUNNER_TEMP/tag-card/release_card.md"
            git fetch -q --force --depth 1 origin "+refs/tags/$tag:refs/tags/$tag"
            [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || { echo "::error::$tag is a lightweight tag: it holds no release card"; exit 1; }
            git for-each-ref --format='%(contents)' "refs/tags/$tag" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > "$msg"
            mkdir -p "${card%/*}"
            sed -n '/^# /,$p' "$msg" > "$card"
            [[ -s "$card" ]] || { echo "::error::the message of tag $tag holds no release card (no line starting with '# ')"; exit 1; }
            echo "release card from tag $tag: $(head -n 1 "$card")"
            echo "cards=$card" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=()
          # exit 0: the card's tested tree is this tree; exit 1 with "is not the card's": another
          # tree, the only result that skips a card. Anything else (a card whose data block is
          # missing or malformed: exit 2; tools_ref older than 3.1.0; git missing) fails the job.
          while IFS= read -r -d '' card; do
            rc=0
            out="$("$RUNNER_TEMP/venv/bin/python" -m xewe release-card fingerprint --card "$card" --check)" || rc=$?
            echo "$out"
            case "$rc" in
              0) found+=("$card") ;;
              1) [[ "$out" == *"is not the card's"* ]] || { echo "::error::xewe release-card fingerprint failed on $card (exit 1)"; exit 1; } ;;
              *) echo "::error::xewe release-card fingerprint failed on $card (exit $rc)"; exit "$rc" ;;
            esac
          done < <(git ls-files -z -- 'releases/*/release_card.md' 'modules/*/releases/*/release_card.md')
          echo "cards=${found[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#found[@]} -gt 0 ]] || echo "::notice::no release card for this tree; the check is skipped"
      - uses: actions/download-artifact@v8
        if: steps.find.outputs.cards != ''
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card
      # CI runs the unit tests only, so the card's board rows are not compared (--unit-only, §14).
      # No --meta-dir: this workflow builds no firmware image, so the card's image rows are not
      # compared either (an artifact keeps no empty directory, so an empty meta dir would not arrive).
      - name: xewe release-card verify --ci
        if: steps.find.outputs.cards != ''
        env:
          CARDS: ${{ steps.find.outputs.cards }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra cards <<< "$CARDS"
          for card in "${cards[@]}"; do
            "$RUNNER_TEMP/venv/bin/python" -m xewe release-card verify --ci --unit-only --card "$card" \
              --junit-dir "$RUNNER_TEMP/card/junit"
          done

  # Run from the checkout root (no path): arduino-lint reads a relative "." as the folder name and
  # fails LS003 on it.
  arduino-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          project-type: library
          library-manager: update
          compliance: strict

  # Every examples/*/*.ino against the checked-out library, with the arduino-cli and esp32 core
  # versions (src/xewe/env/pins.py) and the FQBNs (src/xewe/build/chips.py) of the tools at tools_ref.
  examples:
    name: examples (${{ matrix.chip }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chip: [c3, c6, s3]
    steps:
      - uses: actions/checkout@v7
      - name: Read the toolchain pins and the FQBN from the tools
        id: pins
        env:
          REF: ${{ inputs.tools_ref }}
          CHIP: ${{ matrix.chip }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/xewe-tools"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 https://github.com/xewe-labs/xewe-os-tools "$REF"
          git -C "$dest" checkout -q FETCH_HEAD
          PYTHONPATH="$dest/src" python3 - "$CHIP" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from xewe.build.chips import get
          from xewe.env.pins import ARDUINO_CLI_VERSION, ESP32_CORE_VERSION, ESP32_INDEX_URL
          print(f"cli={ARDUINO_CLI_VERSION}")
          print(f"esp32={ESP32_CORE_VERSION}")
          print(f"index={ESP32_INDEX_URL}")
          print(f"fqbn={get(sys.argv[1]).fqbn}")
          PY
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ steps.pins.outputs.cli }}
      - uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ runner.arch }}-esp32-${{ steps.pins.outputs.esp32 }}
      - name: Install the esp32 core and ArduinoJson
        env:
          ESP32: ${{ steps.pins.outputs.esp32 }}
          INDEX: ${{ steps.pins.outputs.index }}
          AJ: ${{ inputs.arduinojson_ref }}
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install "esp32:esp32@$ESP32" --additional-urls "$INDEX"
          arduino-cli lib install "ArduinoJson@${AJ#v}"
      - name: Compile examples/*/*.ino
        env:
          FQBN: ${{ steps.pins.outputs.fqbn }}
        run: |
          set -euo pipefail
          for ino in examples/*/*.ino; do
            echo "::group::$ino"
            arduino-cli compile --fqbn "$FQBN" --warnings default --library . "$ino"
            echo "::endgroup::"
          done

  # The tools at tools_ref, plus ruff and clang-format at fixed versions so a newer release
  # never turns a formatted tree red. XEWE_CLANG_FORMAT picks the pip one over the runner's.
  format:
    name: xewe format --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe format --check
        env:
          REF: ${{ inputs.tools_ref }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF" "ruff==0.17.0" "clang-format==23.1.3"
          XEWE_CLANG_FORMAT="$RUNNER_TEMP/venv/bin/clang-format" "$RUNNER_TEMP/venv/bin/xewe" --project . format --check

  brand-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe brand-lint
        env:
          REF: ${{ inputs.tools_ref }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF"
          "$RUNNER_TEMP/venv/bin/python" -m xewe brand-lint .
