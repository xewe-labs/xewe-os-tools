# xewe-modules-tests.yml: reusable checks for xewe-os-modules. Like the local harness flow
# (run_tests/00_setup.sh): a template clone with every module selected and the modules source
# pointed at the commit under test, then the validator, the module unit tests and one compile.
# Plus `xewe format --check` over modules/ and tools/ (blocking with strict_lint: true) and
# `xewe brand-lint` (blocking), and on a prepare commit the release-card check
# (`xewe release-card verify --ci`, blocking).
name: xewe-modules-tests

on:
  workflow_call:
    inputs:
      template_ref:
        description: "xewe-os template ref used as the harness"
        type: string
        default: "main"
      chip:
        description: "chip to compile the all-modules harness for"
        type: string
        default: "c3"
      python-version:
        type: string
        default: "3.12"
      tools_ref:
        description: "xewe-os-tools ref whose format and brand-lint are used"
        type: string
        default: "main"
      strict_lint:
        description: "make the format job blocking; the modules repo passes true once its format commit has landed"
        type: boolean
        default: false

permissions:
  contents: read

env:
  XEWE_NO_BOARD: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  harness:
    name: validator, unit tests, ${{ inputs.chip }} compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XEWE_MODULES_SOURCE: ${{ github.workspace }}/modules
    steps:
      - uses: actions/checkout@v7
        with:
          path: modules
      - uses: actions/checkout@v7
        with:
          repository: xewe-labs/xewe-os
          ref: ${{ inputs.template_ref }}
          path: harness
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Resolve the tools ref and the toolchain pins
        id: pins
        shell: bash
        working-directory: harness
        run: |
          set -euo pipefail
          read -r repo ref < <(python3 -c 'import tomllib; t = tomllib.load(open("xewe.toml", "rb")).get("tools", {}); print(t.get("repo", "https://github.com/xewe-labs/xewe-os-tools"), t.get("ref", "latest"))')
          dest="$RUNNER_TEMP/xewe-tools"
          if [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
            git init -q "$dest"; git -C "$dest" fetch -q --depth 1 "$repo" "$ref"; git -C "$dest" checkout -q FETCH_HEAD
          else
            track="$ref"; [[ "$ref" == latest ]] && track=""
            git clone -q --depth 1 ${track:+--branch "$track"} "$repo" "$dest"
          fi
          pins="$dest/src/xewe/env/pins.py"; [[ -f "$pins" ]] || pins="$dest/src/env/pins.py"
          python3 - "$pins" >> "$GITHUB_OUTPUT" <<'PY'
          import runpy, sys
          pins = runpy.run_path(sys.argv[1])
          print(f"cli={pins['ARDUINO_CLI_VERSION']}")
          print(f"esp32={pins['ESP32_CORE_VERSION']}")
          PY

      - name: Cache the shared toolchain (~/.xewe-os/build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ~/.xewe-os/build-tools/bin
            ~/.xewe-os/build-tools/arduino15
            ~/.xewe-os/build-tools/arduino-user
          key: xewe-toolchain-${{ runner.os }}-${{ runner.arch }}-cli${{ steps.pins.outputs.cli }}-esp32-${{ steps.pins.outputs.esp32 }}

      - name: harness ./setup.sh --modules all
        working-directory: harness
        run: ./setup.sh --modules all </dev/null

      - name: tools/validate.py
        run: harness/build/tools/.venv/bin/python modules/tools/validate.py --harness harness

      # JUnit as the release card records it (the card job compares the two)
      - name: module unit tests
        run: >-
          harness/build/tools/.venv/bin/python -m xewe --project harness test --unit-only --
          --junitxml="$RUNNER_TEMP/card/junit/tests-unit.xml" -o junit_family=xunit1 -o junit_logging=no -ra

      - name: compile the all-modules harness
        env:
          CHIP: ${{ inputs.chip }}
        run: |
          harness/build/tools/.venv/bin/python -m xewe --project harness build --chip "$CHIP"
          mkdir -p "$RUNNER_TEMP/card/meta"
          cp "harness/build/builds/$CHIP/out/meta.json" "$RUNNER_TEMP/card/meta/build-$CHIP.meta.json"

      - name: Upload the card inputs
        uses: actions/upload-artifact@v7
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card/
          retention-days: 14

  # On a prepare commit (HEAD holds releases/<v>/release_card.md or modules/<m>/releases/<v>/
  # release_card.md and the card's tested tree is HEAD's tree), every such card must agree with
  # these CI results: `xewe release-card verify --ci`. On any other commit the job finds no card
  # and its steps are skipped.
  card:
    name: release card check
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      # the fingerprint is the tools' own (`xewe release-card fingerprint`, doc/spec.md §14), so
      # this job and `verify` can never disagree on what "this tree" is
      - name: Install the tools
        env:
          REF: ${{ inputs.tools_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF"
      - name: Release card for this tree
        id: find
        shell: bash
        run: |
          set -euo pipefail
          # A tag run: the card is the tag message's (notes lines, a blank line, then release_card.md
          # from its first `# ` line on; tag made with `git tag -a --cleanup=verbatim`), never the tree's.
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag="$GITHUB_REF_NAME" msg="$RUNNER_TEMP/tag-message.txt" card="$RUNNER_TEMP/tag-card/release_card.md"
            git fetch -q --force --depth 1 origin "+refs/tags/$tag:refs/tags/$tag"
            [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || { echo "::error::$tag is a lightweight tag: it holds no release card"; exit 1; }
            git for-each-ref --format='%(contents)' "refs/tags/$tag" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > "$msg"
            mkdir -p "${card%/*}"
            sed -n '/^# /,$p' "$msg" > "$card"
            [[ -s "$card" ]] || { echo "::error::the message of tag $tag holds no release card (no line starting with '# ')"; exit 1; }
            echo "release card from tag $tag: $(head -n 1 "$card")"
            echo "cards=$card" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=()
          # exit 0: the card's tested tree is this tree; exit 1 with "is not the card's": another
          # tree, the only result that skips a card. Anything else (a card whose data block is
          # missing or malformed: exit 2; tools_ref older than 3.1.0; git missing) fails the job.
          while IFS= read -r -d '' card; do
            rc=0
            out="$("$RUNNER_TEMP/venv/bin/python" -m xewe release-card fingerprint --card "$card" --check)" || rc=$?
            echo "$out"
            case "$rc" in
              0) found+=("$card") ;;
              1) [[ "$out" == *"is not the card's"* ]] || { echo "::error::xewe release-card fingerprint failed on $card (exit 1)"; exit 1; } ;;
              *) echo "::error::xewe release-card fingerprint failed on $card (exit $rc)"; exit "$rc" ;;
            esac
          done < <(git ls-files -z -- 'releases/*/release_card.md' 'modules/*/releases/*/release_card.md')
          echo "cards=${found[*]}" >> "$GITHUB_OUTPUT"
          [[ ${#found[@]} -gt 0 ]] || echo "::notice::no release card for this tree; the check is skipped"
      - uses: actions/download-artifact@v8
        if: steps.find.outputs.cards != ''
        with:
          name: card-inputs
          path: ${{ runner.temp }}/card
      # CI runs the unit tests only, so the card's board rows are not compared (--unit-only, §14)
      - name: xewe release-card verify --ci
        if: steps.find.outputs.cards != ''
        env:
          CARDS: ${{ steps.find.outputs.cards }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra cards <<< "$CARDS"
          for card in "${cards[@]}"; do
            "$RUNNER_TEMP/venv/bin/python" -m xewe release-card verify --ci --unit-only --card "$card" \
              --junit-dir "$RUNNER_TEMP/card/junit" --meta-dir "$RUNNER_TEMP/card/meta"
          done

  # The tools at tools_ref, plus ruff and clang-format at fixed versions so a newer release
  # never turns a formatted tree red. XEWE_CLANG_FORMAT picks the pip one over the runner's.
  # Non-blocking until the caller passes strict_lint: true.
  format:
    name: ${{ inputs.strict_lint && 'xewe format --check' || 'xewe format --check (non-blocking)' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !inputs.strict_lint }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe format --check
        env:
          REF: ${{ inputs.tools_ref }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF" "ruff==0.17.0" "clang-format==23.1.3"
          XEWE_CLANG_FORMAT="$RUNNER_TEMP/venv/bin/clang-format" "$RUNNER_TEMP/venv/bin/xewe" format --check modules tools

  brand-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: xewe brand-lint
        env:
          REF: ${{ inputs.tools_ref }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "git+https://github.com/xewe-labs/xewe-os-tools@$REF"
          "$RUNNER_TEMP/venv/bin/python" -m xewe brand-lint .
